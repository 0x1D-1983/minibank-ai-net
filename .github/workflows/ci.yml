name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONFIGURATION: Release

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore MiniBank.AI.slnx

      - name: Build
        run: dotnet build MiniBank.AI.slnx --no-restore --configuration ${{ env.CONFIGURATION }}

      # - name: Unit tests
      #   run: dotnet test MiniBank.AI.slnx --no-build --configuration ${{ env.CONFIGURATION }} --filter FullyQualifiedName~CustomerToolsTests --verbosity normal

