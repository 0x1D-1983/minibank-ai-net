apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ai-runtime
  labels:
    app: ollama
    app.kubernetes.io/component: inference-worker
    app.kubernetes.io/part-of: minibank-ai-runtime
    model: qwen2.5-1.5b-instruct
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: ollama
        app.kubernetes.io/component: inference-worker
        app.kubernetes.io/part-of: minibank-ai-runtime
        model: qwen2.5-1.5b-instruct
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: ollama
          image: ollama/ollama:0.33.3
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              ollama serve &
              pid=$!
              trap "kill $pid; wait $pid" TERM INT
              until ollama list >/dev/null 2>&1; do
                sleep 1
              done
              ollama pull "$OLLAMA_MODEL"
              wait $pid
          ports:
            - name: http
              containerPort: 11434
          envFrom:
            - configMapRef:
                name: ollama-config
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 8Gi
          startupProbe:
            exec:
              command: ["/bin/sh", "-c", "ollama show \"$OLLAMA_MODEL\""]
            periodSeconds: 10
            failureThreshold: 90
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-models
