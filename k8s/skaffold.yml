apiVersion: skaffold/v4beta13
kind: Config
metadata:
  name: minibank-ai-runtime
manifests:
  kustomize:
    paths:
      - ./ollama
      - ./gateway
deploy:
  kubectl:
    defaultNamespace: ai-runtime
portForward:
  - resourceType: service
    resourceName: ollama
    namespace: ai-runtime
    port: 11434
    localPort: 11434
  - resourceType: service
    resourceName: ai-gateway
    namespace: ai-runtime
    port: 8080
    localPort: 8080
