apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-gateway
  namespace: ai-runtime
  labels:
    app: ai-gateway
    app.kubernetes.io/component: internal-ai-api
    app.kubernetes.io/part-of: minibank-ai-runtime
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-gateway
  template:
    metadata:
      labels:
        app: ai-gateway
        app.kubernetes.io/component: internal-ai-api
        app.kubernetes.io/part-of: minibank-ai-runtime
    spec:
      containers:
        - name: envoy
          image: envoyproxy/envoy:v1.31-latest
          args:
            - -c
            - /etc/envoy/envoy.yaml
            - -l
            - info
          ports:
            - name: http
              containerPort: 8080
            - name: admin
              containerPort: 9901
          resources:
            requests:
              cpu: 10m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/envoy
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: envoy-conf
