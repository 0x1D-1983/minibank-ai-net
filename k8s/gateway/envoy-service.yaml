apiVersion: v1
kind: Service
metadata:
  name: ai-gateway
  namespace: ai-runtime
  labels:
    app: ai-gateway
    app.kubernetes.io/component: internal-ai-api
    app.kubernetes.io/part-of: minibank-ai-runtime
spec:
  type: ClusterIP
  selector:
    app: ai-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
