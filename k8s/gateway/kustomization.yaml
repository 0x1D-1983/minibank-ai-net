apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: ai-gateway
  annotations:
    config.kubernetes.io/local-config: "true"
namespace: ai-runtime
configMapGenerator:
  - name: envoy-conf
    files:
      - envoy.yaml
resources:
  - envoy-deployment.yaml
  - envoy-service.yaml
  - model-catalog.yaml
